name: Sync upstream

on:
  schedule:
    # Run every six hours. Scheduled workflows use UTC.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync main from upstream
        env:
          GH_TOKEN: ${{ github.token }}
          CONFLICT_ISSUE_TITLE: "Upstream sync conflict"
        shell: bash
        run: |
          response_file="$(mktemp)"
          status_code="$(
            curl --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/merge-upstream" \
              --data '{"branch":"main"}'
          )"

          cat "$response_file"

          open_issue="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --search "${CONFLICT_ISSUE_TITLE} in:title" \
              --json number,title \
              --jq ".[] | select(.title == env.CONFLICT_ISSUE_TITLE) | .number" \
              | head -n 1
          )"

          if [[ "$status_code" == "200" ]]; then
            if [[ -n "$open_issue" ]]; then
              gh issue close "$open_issue" \
                --repo "$GITHUB_REPOSITORY" \
                --comment "Upstream synchronization is working again. Closing this notification automatically."
            fi
            exit 0
          fi

          if [[ "$status_code" == "409" ]]; then
            if [[ -z "$open_issue" ]]; then
              gh issue create \
                --repo "$GITHUB_REPOSITORY" \
                --title "$CONFLICT_ISSUE_TITLE" \
                --assignee "$GITHUB_REPOSITORY_OWNER" \
                --body "The scheduled upstream synchronization could not merge upstream/main into main because of conflicts. Resolve the conflicts manually, then re-run the Sync upstream workflow."
            fi

            echo "Upstream synchronization failed because of merge conflicts." >&2
            exit 1
          fi

          echo "Upstream synchronization failed with HTTP status ${status_code}." >&2
          exit 1
