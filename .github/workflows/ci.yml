name: Build and Publish AfxHookSource2

on:
  push:
    branches: [main]
    tags: ["v*"]
  merge_group:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/iron
          check-latest: true
      - uses: MinoruSekine/setup-scoop@v4

      - name: Update submodules
        run: git submodule update --init --recursive

      - name: Install gettext
        run: scoop install gettext

      - name: CMake - Configure Source2
        working-directory: "${{github.workspace}}"
        run: |
          $diagnostics = "OFF"
          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref }}" -eq "refs/heads/main") {
            $diagnostics = "ON"
          }
          cmake --preset x64-release "-DAFX_MIRV_POV_DIAGNOSTICS=$diagnostics"

      - name: CMake - Build Source2
        working-directory: "${{github.workspace}}"
        run: cmake --build --preset x64-release --target AfxHookSource2

      - name: Compile storm grading shader entries
        shell: pwsh
        run: |
          $content = [IO.File]::ReadAllText('AfxHookSource2/MirvWeatherRender.cpp')
          if ($content -notmatch '(?s)const char \* shader=R"\((.*?)\)";') { throw 'Storm shader source not found' }
          $shader = Join-Path $env:RUNNER_TEMP 'mirv-weather-storm.hlsl'
          [IO.File]::WriteAllText($shader, $Matches[1])
          $fxc = Get-ChildItem -LiteralPath "${env:ProgramFiles(x86)}/Windows Kits/10/bin" -Filter fxc.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\fxc.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$fxc) { throw 'Windows SDK fxc missing' }
          & $fxc.FullName /nologo /Ges /T vs_5_0 /E VS /Fo (Join-Path $env:RUNNER_TEMP 'storm-vs.cso') $shader
          if ($LASTEXITCODE -ne 0) { throw 'Storm VS compilation failed' }
          & $fxc.FullName /nologo /Ges /T ps_5_0 /E PS /Fo (Join-Path $env:RUNNER_TEMP 'storm-ps.cso') $shader
          if ($LASTEXITCODE -ne 0) { throw 'Storm PS compilation failed' }

      - name: CMake - Install Source2
        working-directory: "${{github.workspace}}"
        run: |
          cmake --install build/x64-release --config Release --prefix build/staging-release --component x64-runtime
          cmake --install build/x64-release --config Release --prefix build/staging-release --component x64-source2

      - name: Prepare licensed binary and corresponding source
        shell: pwsh
        run: |
          $staging = Join-Path $env:GITHUB_WORKSPACE "build/staging-release"
          $release = Join-Path $env:GITHUB_WORKSPACE "release"
          New-Item -ItemType Directory -Force -Path $release | Out-Null

          $source = $null
          $candidates = @(
            "bin/x64/AfxHookSource2.dll",
            "x64/AfxHookSource2.dll"
          )
          foreach ($candidate in $candidates) {
            $candidatePath = Join-Path $staging $candidate
            if (Test-Path -LiteralPath $candidatePath -PathType Leaf) {
              $source = $candidatePath
              break
            }
          }

          if ($null -eq $source) {
            throw "Could not find AfxHookSource2.dll in $staging. Checked: $($candidates -join ', ')"
          }

          $shortSha = $env:GITHUB_SHA.Substring(0, 12)
          $binaryRoot = Join-Path $env:RUNNER_TEMP "AfxHookSource2-$shortSha-windows-x64"
          New-Item -ItemType Directory -Force -Path $binaryRoot | Out-Null
          Copy-Item -LiteralPath $source -Destination (Join-Path $binaryRoot "AfxHookSource2.dll")
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "LICENSE") -Destination $binaryRoot
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "NOTICE.md") -Destination $binaryRoot
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "LICENSES") -Destination $binaryRoot -Recurse
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "AfxHookSource2/MIRV_POV_LICENSE.md") -Destination $binaryRoot

          $thirdPartyRoot = Join-Path $binaryRoot "THIRD_PARTY_LICENSES"
          Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "deps/release") -Recurse -File |
            Where-Object { $_.Name -match '^(LICENSE|COPYING|NOTICE)(\.|$)' } |
            ForEach-Object {
              $relative = [System.IO.Path]::GetRelativePath($env:GITHUB_WORKSPACE, $_.FullName)
              $destination = Join-Path $thirdPartyRoot $relative
              New-Item -ItemType Directory -Force -Path (Split-Path $destination) | Out-Null
              Copy-Item -LiteralPath $_.FullName -Destination $destination
            }

          $binaryArchive = Join-Path $release "AfxHookSource2-$shortSha-windows-x64.zip"
          Compress-Archive -Path (Join-Path $binaryRoot "*") -DestinationPath $binaryArchive

          $sourceRoot = Join-Path $env:RUNNER_TEMP "AfxHookSource2-$shortSha-source"
          New-Item -ItemType Directory -Force -Path $sourceRoot | Out-Null
          # Diagnostic history is not required corresponding source and may contain local paths.
          git ls-files --recurse-submodules | Where-Object { $_ -ne 'doc/notes/cs2-pov-native-logic.md' } | ForEach-Object {
            $sourcePath = Join-Path $env:GITHUB_WORKSPACE $_
            if (Test-Path -LiteralPath $sourcePath -PathType Leaf) {
              $destination = Join-Path $sourceRoot $_
              New-Item -ItemType Directory -Force -Path (Split-Path $destination) | Out-Null
              Copy-Item -LiteralPath $sourcePath -Destination $destination
            }
          }
          @(
            "Repository commit: $env:GITHUB_SHA"
            ""
            "Submodules:"
            (git submodule status --recursive)
          ) | Set-Content -LiteralPath (Join-Path $sourceRoot "SOURCE-COMMIT.txt") -Encoding utf8

          $sourceArchive = Join-Path $release "AfxHookSource2-$shortSha-source.zip"
          Compress-Archive -Path (Join-Path $sourceRoot "*") -DestinationPath $sourceArchive

      - name: Upload licensed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AfxHookSource2-${{ github.sha }}
          path: release
          if-no-files-found: error
          retention-days: 30

  publish_prerelease:
    name: Publish DLL prerelease
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download licensed release assets
        uses: actions/download-artifact@v4
        with:
          name: AfxHookSource2-${{ github.sha }}
          path: release

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: prerelease-${{ github.run_number }}-${{ github.sha }}
          RELEASE_TITLE: AfxHookSource2 prerelease ${{ github.sha }}
        run: |
          short_sha="${GITHUB_SHA:0:12}"
          binary_archive="AfxHookSource2-${short_sha}-windows-x64.zip"
          source_archive="AfxHookSource2-${short_sha}-source.zip"
          commit_message="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq '.commit.message')"
          notes_file="${RUNNER_TEMP}/prerelease-notes.md"

          {
            printf '## How to use\n\n'
            printf '1. Download **`%s`** from this release. The `*-source.zip` and GitHub-generated source archives are for source code, not installation.\n\n' "$binary_archive"
            printf '%s\n\n' \
              '2. Install a complete, compatible [official HLAE](https://github.com/advancedfx/advancedfx/releases) first (prefer the upstream version used by this build). This prerelease is a DLL replacement, not a complete HLAE distribution.' \
              '3. Close CS2. Back up `<HLAE>/x64/AfxHookSource2.dll`, then extract this binary ZIP into `<HLAE>/x64/` and replace that DLL. The final path must be `<HLAE>/x64/AfxHookSource2.dll`, not a nested archive folder. Keep the bundled license files; do not extract into the CS2 game directory. Preserve the rest of the HLAE installation, including `resources/AfxHookSource2/snippets/mirv_script_voice.js`.' \
              '4. Launch CS2 through HLAE, play a local demo, switch to the player you want to observe in first person, and enter these console commands:'
            printf '%s\n' '```text' 'mirv_pov 1' 'mirv_pov_buymenu 1' 'mirv_pov_scoreboard 1' '```'
            printf '\n%s\n\n' \
              '`mirv_pov 1` is the main switch (`mirv_pov 0` disables it). Buy-menu and scoreboard replay are optional and disabled by default; the last two commands enable them. They follow recorded demo state, not a real purchase.' \
              'Independent effects: run `mirv_pov_debug_feature` to list states, then `mirv_pov_debug_feature <feature> 0` to disable one (`1` to restore). Non-immediate changes require `mirv_pov 0` followed by `mirv_pov 1`. For player voice routing, use `mirv_pov_voice team|all|enemy|off` (choose one mode; default: `team`).' \
              '**Safety / compatibility:** use only for offline demo playback and video creation, never join VAC-protected servers with HLAE. CS2 updates can break hooks; an unsupported-build warning is not a reason to bypass compatibility checks. Fast-changing images may affect photosensitive users.'
            printf 'See the [POV feature and switch guide](https://github.com/%s/blob/%s/README.md) for defaults, dependencies and troubleshooting.\n\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf '## Commit\n\n'
            printf '[`%s`](https://github.com/%s/commit/%s)\n\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf '### Commit message\n\n'
            printf '%s\n' "$commit_message" | sed 's/^/> /'
            printf '\n\n## Corresponding source\n\n'
            printf 'Download `%s` from this release for the complete corresponding source. ' "$source_archive"
            printf 'This AfxHookSource2 binary includes the AGPL-3.0-only mirv_pov feature; '
            printf 'separate AdvancedFX and third-party source retains its original license.\n'
          } > "$notes_file"

          gh release create "$RELEASE_TAG" release/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TITLE" \
            --target "$GITHUB_SHA" \
            --notes-file "$notes_file" \
            --prerelease \
            --latest=false \
            --generate-notes

  publish_release:
    name: Publish DLL release
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download licensed release assets
        uses: actions/download-artifact@v4
        with:
          name: AfxHookSource2-${{ github.sha }}
          path: release

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_LICENSE_NOTICE: This AfxHookSource2 binary includes the AGPL-3.0-only mirv_pov feature. Download the matching source archive beside the binary archive for the complete corresponding source; separate AdvancedFX and third-party source retains its original license.
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*.zip --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest=true
          else
            gh release create "$RELEASE_TAG" release/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "AfxHookSource2 $RELEASE_TAG" \
              --notes "$RELEASE_LICENSE_NOTICE" \
              --verify-tag \
              --latest=true \
              --generate-notes
          fi

  publish_weather_contact:
    name: Publish seven-map storm test package
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/dust2-command-weather' }}
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AfxHookSource2-${{ github.sha }}
          path: artifacts
      - name: Generate authored storm bolt particle
        shell: pwsh
        run: |
          python tools/generate_weather_bolt.py --output generated/storm_bolt.vpcf_c --check --json
          if ($LASTEXITCODE -ne 0) { throw 'Generated storm bolt particle failed self-verification' }
      - name: Assemble DLL with corresponding source and licensed weather data
        shell: pwsh
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 12)
          $binary = "artifacts/AfxHookSource2-$shortSha-windows-x64.zip"
          $source = "artifacts/AfxHookSource2-$shortSha-source.zip"
          if (!(Test-Path -LiteralPath $binary) -or !(Test-Path -LiteralPath $source)) { throw 'Missing corresponding binary/source archives' }
          New-Item -ItemType Directory -Path stage/x64,release -Force | Out-Null
          Expand-Archive -LiteralPath $binary -DestinationPath stage/x64
          Expand-Archive -LiteralPath delivery/seven-map-weather-resources.zip -DestinationPath stage
          # The authored bolt is generated at build time from tools/generate_weather_bolt.py
          # (complete corresponding source) instead of being checked in as opaque bytes.
          $bolt = 'generated/storm_bolt.vpcf_c'
          if (!(Test-Path -LiteralPath $bolt)) { throw 'Generated storm bolt particle missing' }
          $boltTarget = 'stage/resources/AfxHookSource2/cs2/particles/mirv_weather/storm_bolt.vpcf_c'
          New-Item -ItemType Directory -Force -Path (Split-Path $boltTarget) | Out-Null
          Copy-Item -LiteralPath $bolt -Destination $boltTarget
          Copy-Item -LiteralPath doc/notes/seven-map-storm-user-guide.txt -Destination stage/使用说明.txt
          @(
            "DLL/source build commit: $env:GITHUB_SHA"
            "Build run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            'Build: Windows Release x64 success'
            'CS2: 1.41.8.9 / source revision 11087167'
            'Seven-map visual and repeated-seek acceptance: pending'
            ('DLL SHA256: ' + (Get-FileHash -LiteralPath stage/x64/AfxHookSource2.dll -Algorithm SHA256).Hash)
          ) | Set-Content -LiteralPath stage/BUILD-INFO.txt -Encoding utf8
          Compress-Archive -Path stage/* -DestinationPath "release/Seven-map-storm-$shortSha-test.zip"
          Copy-Item -LiteralPath $source -Destination release
      - name: Publish matching test DLL and source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 12)
          $tag = "seven-map-storm-$shortSha"
          @(
            'Extend seven-map weather with guarded native sun/exposure, before-UI grading, native lightning and owned rain/thunder audio. Lightning uses demo time and the final kept killfeed result. Preserve the user-selected night-rain sky and original seven-map resource profiles. Additional static puddle meshes and baked-lighting rebuilds remain outside this controller.'
            ''
            'Use a complete official HLAE 2.192.6 installation. Download the Seven-map-storm test ZIP for the replacement DLL, separate weather data and Chinese instructions. It does not replace game maps or require a separate launcher.'
            ''
            "DLL and complete corresponding source commit: $env:GITHUB_SHA. Windows Release x64 build passed; in-game seven-map indoor/outdoor, native ground, restore/seek, performance and recording acceptance is pending."
            ''
            'DLL software retains its licenses; weather data is separately licensed under PolyForm Noncommercial 1.0.0 with notices and provenance included.'
          ) | Set-Content -LiteralPath notes.txt -Encoding utf8
          $assets = Get-ChildItem -LiteralPath release -Filter '*.zip' | ForEach-Object { $_.FullName }
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Seven-map storm test - $shortSha" --notes-file notes.txt --prerelease --latest=false
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
